<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1440"
  height="860"
  viewBox="0 0 1440 860"
  role="img"
  data-language="zh-CN"
  aria-labelledby="title description"
>
  <title id="title">DevProof 整体架构</title>
  <desc id="description">
    Task Producer 和外部上下文进入 DevProof Control Plane，Agent Runtime 领取任务并调用 Execution Runner，Console 提供人工接管，PostgreSQL、Redis 和对象存储保存状态与证据。
  </desc>

  <defs>
    <marker
      id="arrow"
      markerWidth="10"
      markerHeight="10"
      refX="8"
      refY="5"
      orient="auto"
      markerUnits="strokeWidth"
    >
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#667085" />
    </marker>
    <style>
      .sans {
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }
      .mono {
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      }
      .eyebrow {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 1.8px;
      }
      .section-title {
        font-size: 20px;
        font-weight: 700;
      }
      .card-title {
        font-size: 16px;
        font-weight: 700;
      }
      .body {
        font-size: 14px;
        font-weight: 500;
      }
      .small {
        font-size: 12px;
        font-weight: 500;
      }
      .flow {
        fill: none;
        stroke: #667085;
        stroke-width: 1.8;
        marker-end: url(#arrow);
      }
      .flow-dashed {
        fill: none;
        stroke: #98a2b3;
        stroke-dasharray: 6 6;
        stroke-width: 1.6;
        marker-end: url(#arrow);
      }
    </style>
  </defs>

  <rect width="1440" height="860" fill="#f6f7f9" />
  <path d="M 0 0 H 1440 V 6 H 0 Z" fill="#171a21" />

  <g class="sans">
    <text x="48" y="57" fill="#171a21" font-size="30" font-weight="750">
      DevProof 整体架构
    </text>
    <text x="48" y="85" fill="#667085" font-size="15" font-weight="500">
      从测试目标到可恢复执行、完整证据链与结构化判定
    </text>
    <rect x="1122" y="42" width="270" height="35" fill="#ffffff" stroke="#d0d5dd" />
    <circle cx="1143" cy="59.5" r="5" fill="#12b76a" />
    <text x="1157" y="64" class="mono small" fill="#344054">
      FREE · SELF-HOSTED · AGENT-NEUTRAL
    </text>

    <!-- Task producers -->
    <rect x="48" y="130" width="250" height="205" fill="#ffffff" stroke="#d0d5dd" />
    <rect x="48" y="130" width="250" height="5" fill="#344054" />
    <text x="68" y="164" class="eyebrow" fill="#667085">TASK PRODUCERS</text>
    <text x="68" y="195" class="section-title" fill="#101828">任务入口</text>
    <text x="68" y="222" class="body" fill="#475467">描述目标、验收标准与执行能力</text>

    <rect x="68" y="247" width="96" height="29" fill="#f2f4f7" stroke="#e4e7ec" />
    <text x="88" y="266" class="mono small" fill="#344054">Codex</text>
    <rect x="174" y="247" width="104" height="29" fill="#f2f4f7" stroke="#e4e7ec" />
    <text x="194" y="266" class="mono small" fill="#344054">Claude</text>
    <rect x="68" y="286" width="96" height="29" fill="#f2f4f7" stroke="#e4e7ec" />
    <text x="83" y="305" class="mono small" fill="#344054">Playground</text>
    <rect x="174" y="286" width="104" height="29" fill="#f2f4f7" stroke="#e4e7ec" />
    <text x="193" y="305" class="mono small" fill="#344054">API Client</text>

    <!-- Context sources -->
    <rect x="48" y="390" width="250" height="182" fill="#ffffff" stroke="#d0d5dd" />
    <rect x="48" y="390" width="250" height="5" fill="#7f56d9" />
    <text x="68" y="424" class="eyebrow" fill="#6941c6">CONTEXT SOURCES</text>
    <text x="68" y="455" class="section-title" fill="#101828">外部上下文</text>
    <text x="68" y="482" class="body" fill="#475467">解析后固化为不可变任务快照</text>
    <text x="68" y="525" class="mono body" fill="#344054">Linear</text>
    <text x="140" y="525" class="mono body" fill="#344054">GitHub</text>
    <text x="215" y="525" class="mono body" fill="#344054">Knowledge</text>
    <path d="M 68 543 H 278" stroke="#e4e7ec" />
    <text x="68" y="558" class="small" fill="#667085">Issue · PR · Deployment · RAG</text>

    <!-- Control plane -->
    <rect x="370" y="118" width="520" height="536" fill="#171a21" stroke="#171a21" />
    <rect x="370" y="118" width="7" height="536" fill="#12b76a" />
    <text x="402" y="157" class="eyebrow" fill="#98a2b3">DEVPROOF CONTROL PLANE</text>
    <text x="402" y="191" font-size="24" font-weight="750" fill="#ffffff">
      任务状态的唯一权威
    </text>
    <text x="402" y="217" class="body" fill="#b7bec9">
      编排生命周期、执行策略、人工介入、证据与最终判定
    </text>

    <rect x="402" y="248" width="217" height="88" fill="#222631" stroke="#3a404e" />
    <text x="420" y="276" class="card-title" fill="#ffffff">Task &amp; Spec</text>
    <text x="420" y="300" class="small" fill="#b7bec9">目标 · 验收标准 · 快照 · Case</text>
    <text x="420" y="320" class="small" fill="#b7bec9">统一输入模型与幂等创建</text>

    <rect x="637" y="248" width="221" height="88" fill="#222631" stroke="#3a404e" />
    <text x="655" y="276" class="card-title" fill="#ffffff">Lifecycle Engine</text>
    <text x="655" y="300" class="small" fill="#b7bec9">Queue · Lease · Retry · Cancel</text>
    <text x="655" y="320" class="small" fill="#b7bec9">超时、断线恢复与终态清理</text>

    <text x="402" y="371" class="eyebrow" fill="#98a2b3">TASK PIPELINE</text>
    <rect x="402" y="389" width="132" height="56" fill="#2b303c" stroke="#454c5c" />
    <text x="419" y="414" class="body" fill="#ffffff">01 · Spec 分析</text>
    <text x="419" y="433" class="small" fill="#b7bec9">Context snapshot</text>
    <path d="M 534 417 H 555" class="flow" stroke="#667085" />
    <rect x="558" y="389" width="132" height="56" fill="#2b303c" stroke="#454c5c" />
    <text x="575" y="414" class="body" fill="#ffffff">02 · Profile</text>
    <text x="575" y="433" class="small" fill="#b7bec9">Identity &amp; access</text>
    <path d="M 690 417 H 711" class="flow" stroke="#667085" />
    <rect x="714" y="389" width="144" height="56" fill="#2b303c" stroke="#454c5c" />
    <text x="731" y="414" class="body" fill="#ffffff">03 · Case Run</text>
    <text x="731" y="433" class="small" fill="#b7bec9">Dispatch &amp; execute</text>

    <rect x="402" y="474" width="138" height="73" fill="#222631" stroke="#3a404e" />
    <text x="420" y="502" class="card-title" fill="#ffffff">Routing</text>
    <text x="420" y="524" class="small" fill="#b7bec9">能力与域名路由</text>
    <rect x="555" y="474" width="138" height="73" fill="#222631" stroke="#3a404e" />
    <text x="573" y="502" class="card-title" fill="#ffffff">HITL</text>
    <text x="573" y="524" class="small" fill="#b7bec9">请求、超时与恢复</text>
    <rect x="708" y="474" width="150" height="73" fill="#222631" stroke="#3a404e" />
    <text x="726" y="502" class="card-title" fill="#ffffff">Observability</text>
    <text x="726" y="524" class="small" fill="#b7bec9">Trace · Audit · Metrics</text>

    <rect x="402" y="576" width="456" height="50" fill="#eaf8f1" stroke="#6ce9a6" />
    <circle cx="425" cy="601" r="7" fill="#12b76a" />
    <text x="443" y="599" class="card-title" fill="#05603a">Evidence-backed verdict</text>
    <text x="443" y="616" class="small" fill="#087443">轨迹与制品聚合为结构化最终判定</text>

    <!-- Agent runtime -->
    <rect x="968" y="130" width="424" height="205" fill="#ffffff" stroke="#d0d5dd" />
    <rect x="968" y="130" width="424" height="5" fill="#1570ef" />
    <text x="990" y="164" class="eyebrow" fill="#175cd3">AGENT RUNTIME</text>
    <text x="990" y="195" class="section-title" fill="#101828">独立模型执行 Worker</text>
    <text x="990" y="224" class="body" fill="#475467">领取 Run，通过租约与 fencing 保持执行权</text>

    <rect x="990" y="249" width="118" height="55" fill="#eff8ff" stroke="#b2ddff" />
    <text x="1008" y="275" class="card-title" fill="#175cd3">Reason</text>
    <text x="1008" y="293" class="small" fill="#175cd3">模型推理</text>
    <rect x="1120" y="249" width="118" height="55" fill="#eff8ff" stroke="#b2ddff" />
    <text x="1138" y="275" class="card-title" fill="#175cd3">Execute</text>
    <text x="1138" y="293" class="small" fill="#175cd3">高层动作</text>
    <rect x="1250" y="249" width="120" height="55" fill="#eff8ff" stroke="#b2ddff" />
    <text x="1268" y="275" class="card-title" fill="#175cd3">Report</text>
    <text x="1268" y="293" class="small" fill="#175cd3">结构化结果</text>

    <!-- Execution runners -->
    <rect x="968" y="390" width="424" height="264" fill="#ffffff" stroke="#d0d5dd" />
    <rect x="968" y="390" width="424" height="5" fill="#f79009" />
    <text x="990" y="424" class="eyebrow" fill="#b54708">EXECUTION RUNNERS</text>
    <text x="990" y="455" class="section-title" fill="#101828">可替换的受控执行环境</text>
    <text x="990" y="483" class="body" fill="#475467">Runtime Protocol 隔离模型与底层环境</text>

    <rect x="990" y="510" width="174" height="106" fill="#fff7ed" stroke="#fec84b" />
    <rect x="1006" y="526" width="57" height="22" fill="#f79009" />
    <text x="1016" y="541" class="eyebrow" fill="#ffffff" font-size="10">ACTIVE</text>
    <text x="1006" y="575" class="card-title" fill="#93370d">Browser Runtime</text>
    <text x="1006" y="597" class="small" fill="#b54708">Browser · Profile · HITL</text>

    <rect x="1178" y="510" width="192" height="106" fill="#f9fafb" stroke="#d0d5dd" />
    <text x="1194" y="541" class="eyebrow" fill="#667085">EXTENSIBLE</text>
    <text x="1194" y="575" class="mono body" fill="#344054">HTTP · Shell</text>
    <text x="1194" y="597" class="mono body" fill="#344054">Container · Custom</text>

    <!-- Main flows -->
    <path d="M 298 225 H 354" class="flow" />
    <text x="307" y="213" class="mono small" fill="#667085">MCP / HTTP</text>
    <path d="M 370 286 H 319 V 272 H 298" class="flow" />
    <text x="305" y="304" class="small" fill="#667085">结果与证据</text>

    <path d="M 298 477 H 354" class="flow-dashed" />
    <text x="307" y="465" class="small" fill="#667085">快照</text>

    <path d="M 890 225 H 952" class="flow" />
    <text x="905" y="213" class="small" fill="#667085">Claim</text>
    <path d="M 968 287 H 914 V 274 H 890" class="flow" />
    <text x="901" y="305" class="small" fill="#667085">Events</text>

    <path d="M 1180 335 V 374" class="flow" />
    <text x="1193" y="362" class="small" fill="#667085">Actions</text>
    <path d="M 968 568 H 925 V 601 H 890" class="flow" />
    <text x="902" y="589" class="small" fill="#667085">Evidence</text>

    <!-- Supporting layer -->
    <rect x="48" y="712" width="432" height="105" fill="#ffffff" stroke="#d0d5dd" />
    <rect x="48" y="712" width="5" height="105" fill="#7f56d9" />
    <text x="72" y="746" class="eyebrow" fill="#6941c6">CONSOLE / HUMAN</text>
    <text x="72" y="775" class="card-title" fill="#101828">配置 · 可观测性 · Browser Handoff</text>
    <text x="72" y="798" class="small" fill="#667085">人工接管原会话，释放控制后由 Agent 继续执行</text>

    <rect x="536" y="712" width="856" height="105" fill="#ffffff" stroke="#d0d5dd" />
    <rect x="536" y="712" width="5" height="105" fill="#344054" />
    <text x="560" y="746" class="eyebrow" fill="#667085">DATA PLANE</text>
    <text x="560" y="775" class="card-title" fill="#101828">PostgreSQL</text>
    <text x="730" y="775" class="card-title" fill="#101828">Redis</text>
    <text x="900" y="775" class="card-title" fill="#101828">Object Storage</text>
    <text x="560" y="798" class="small" fill="#667085">
      权威状态与审计
    </text>
    <text x="730" y="798" class="small" fill="#667085">队列与在线状态</text>
    <text x="900" y="798" class="small" fill="#667085">Screenshot · DOM · Network · Video</text>

    <path d="M 480 764 H 504 V 633 H 536" class="flow-dashed" />
    <text x="487" y="687" class="small" fill="#667085">HITL</text>
    <path d="M 964 712 V 676 H 700 V 654" class="flow-dashed" />
    <text x="976" y="693" class="small" fill="#667085">State &amp; artifacts</text>
  </g>
</svg>
